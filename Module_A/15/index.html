<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List Manager</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .d-none {
            display: none;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #f3f4f6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-bottom: 12px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-order {
            font-size: 14px;
            color: #666;
        }

        .remove-btn {
            background: #dc2626;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>Task List Manager</h1>

    <div class="input-group">

        <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                required
        >

        <button id="addTaskButton">
            Add Task
        </button>

    </div>

    <ul id="taskList">
        <li class="task-empty">
            No tasks added yet.
        </li>
    </ul>

</div>

<script>
    let noTaskElement;
    const taskElement = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskButton');
    let numberTask = 0;
    const tasks = [];
    addTaskBtn.addEventListener('click', () => {
        numberTask++;
        noTaskElement = document.querySelector('.task-empty')
        if (noTaskElement) {
            noTaskElement.remove();
        }
        taskElement.innerHTML += `<li>
            <div class="task-info">
                <strong>${taskInput.value}</strong>
                <span class="task-order">
                        Task #${numberTask}
                    </span>
            </div>
            <button
                    class="remove-btn"
            >
                Remove
            </button>
        </li>`
        tasks.push({
            order: numberTask,
            title: taskInput.value,
        })
    })
    taskElement.addEventListener('click', (ev) => {
        if (ev.target.tagName === 'BUTTON') {
            ev.target.parentElement.remove();
            numberTask--;
            tasks.splice(numberTask, 1);
            if (numberTask < 1) {
                taskElement.innerHTML += `
                            <li class="task-empty">
                                No tasks added yet.
                            </li>
`
            }
        }
    })
</script>
</body>
</html>
