<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: wiggle 2s alternate ease-in-out infinite;
        }

        @keyframes wiggle {
            from {
                transform: rotateZ(25deg);
            }
            to {
                transform: rotateZ(-25deg);
            }
        }

        .scene {
            width: 250px;
            height: 250px;
            perspective: 800px;
        }

        .sphere {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: spin linear 5s infinite;
        }

        @keyframes spin {
            from {
                transform: rotateY(0);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        .line {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: 2px solid black;
            border-radius: 50%;
        }

        .vertical-2 {
            transform: rotateY(45deg);
        }

        .vertical-3 {
            transform: rotateY(90deg);
        }

        .vertical-4 {
            transform: rotateY(135deg);
        }

        .stationary {
            animation: spin reverse linear 5s infinite;
            background: white;
            overflow: hidden;
        }

        .stationary::after, .stationary::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            border: 1px solid black;
            border-radius: 50%;
        }

        .stationary::after {
            height: 125px;
            width: 150%;
            border-width: 2px;
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="sphere">
        <div class="line vertical-1"></div>
        <div class="line vertical-2"></div>
        <div class="line vertical-3"></div>
        <div class="line vertical-4"></div>
        <div class="line stationary"></div>
    </div>
</div>
</body>
</html>
